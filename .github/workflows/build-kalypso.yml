name: Build and push Kalypso image

on:
  push:
    branches:
      - main
    paths:
      - "docker/Dockerfile.kalypso"
      - "docker/kalypso/**"
      - "docker/kalypso.def"
      - "vllm/kalypso/**"
      - "vllm/entrypoints/openai/api_server.py"
      - ".github/workflows/build-kalypso.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The vLLM base image needs ~20 GB unpacked; the runner starts with
      # ~14 GB free. Drop preinstalled toolchains this build never uses.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift \
            /usr/local/share/boost /usr/local/share/powershell
          sudo docker image prune --all --force
          df -h /

      - name: Compute lowercase image name
        run: |
          echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/kalypso" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.kalypso
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:vllm-0.29.0
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
